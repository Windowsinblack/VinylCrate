<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VinylCrate DJ</title>
  <style>
    :root { --bg: #121212; --surface: #1e1e1e; --surface-light: #2a2a2a; --accent: #ff5500; --text: #ffffff; --text-muted: #a0a0a0; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 140px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: var(--surface); border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 10; }
    header h1 { font-size: 1.2rem; letter-spacing: 1px; }
    header h1 span { color: var(--accent); }
    .btn-add { background: var(--accent); color: #fff; border: none; padding: 8px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .crate-info { padding: 12px 16px; color: var(--text-muted); font-size: 0.9rem; }
    .crate-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 16px; }
    .vinyl-card { background: var(--surface); border-radius: 10px; overflow: hidden; border: 2px solid transparent; transition: 0.2s; }
    .vinyl-card.active { border-color: var(--accent); }
    .cover-wrapper { position: relative; width: 100%; aspect-ratio: 1/1; background: var(--surface-light); display: flex; align-items: center; justify-content: center; }
    .cover-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .vinyl-fallback { width: 60%; height: 60%; border-radius: 50%; background: radial-gradient(circle, #333 20%, #111 22%, #111 60%, #222 62%); border: 2px solid #444; }
    .bpm-badge { position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,0.75); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; color: var(--accent); font-weight: bold; }
    .card-btn { position: absolute; top: 6px; background: rgba(0,0,0,0.78); color: #fff; border: none; width: 28px; height: 28px; border-radius: 50%; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn-share { left: 6px; }
    .btn-download { left: 40px; }
    .btn-delete { right: 6px; font-size: 1.1rem; }
    .track-meta { padding: 10px; }
    .track-title { font-size: 0.9rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-note { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
    .modal.open { display: flex; }
    .modal-content { background: var(--surface); width: 100%; max-width: 400px; border-radius: 12px; padding: 20px; max-height: 90vh; overflow-y: auto; }
    .modal-content h2 { margin-bottom: 12px; font-size: 1.1rem; }
    .status-msg { color: var(--accent); font-size: 0.85rem; margin-bottom: 10px; min-height: 18px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
    .form-group input[type="text"], .form-group input[type="number"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: var(--surface-light); color: #fff; }
    .file-input-box { width: 100%; color: var(--text-muted); font-size: 0.85rem; }
    .sc-row { display: flex; gap: 8px; }
    .btn-sc { background: var(--surface-light); color: #fff; border: 1px solid #555; padding: 0 12px; border-radius: 6px; }
    #cover-preview { display: none; width: 80px; height: 80px; object-fit: cover; border-radius: 6px; margin-top: 8px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
    .btn-cancel { background: transparent; color: var(--text-muted); border: 1px solid #444; padding: 10px 16px; border-radius: 6px; }
    .btn-save { background: var(--accent); color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; }
    .dj-player { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid #333; padding: 12px 16px; z-index: 50; }
    .player-top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .player-cover-box { width: 48px; height: 48px; border-radius: 6px; background: var(--surface-light); overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .player-cover-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .player-info { flex: 1; overflow: hidden; }
    .player-title { font-weight: bold; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-sub { font-size: 0.8rem; color: var(--text-muted); }
    .btn-play { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; border: none; font-size: 1.1rem; flex-shrink: 0; }
    .progress-container { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .progress-container span { min-width: 38px; text-align: center; }
    #seek-bar { flex: 1; accent-color: var(--accent); }
    .toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; text-align: center; max-width: 90%; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>VINYL<span>CRATE</span></h1>
    <button type="button" class="btn-add" onclick="openAddModal()">+ Track / Cover</button>
  </header>
  <div class="toast" id="toast-msg"></div>
  <div class="crate-info" id="crate-count">Deine Plattenkiste (0 Tracks)</div>
  <div class="crate-grid" id="crate-grid"></div>
  <div class="modal" id="add-modal">
    <div class="modal-content">
      <h2>Platte in Kiste legen</h2>
      <div class="status-msg" id="modal-status"></div>
      <div class="form-group">
        <label>1. MP3-Datei vom Handy wählen *</label>
        <input type="file" id="mp3-input" accept="audio/*,.mp3" class="file-input-box" onchange="handleMp3Select(this)">
      </div>
      <div class="form-group">
        <label>2. Track-Name</label>
        <input type="text" id="title-input" placeholder="Artist - Trackname">
      </div>
      <div class="form-group">
        <label>3a. Eigenes Coverbild wählen (Galerie)</label>
        <input type="file" id="img-input" accept="image/*" class="file-input-box" onchange="handleImgSelect(this)">
      </div>
      <div class="form-group">
        <label>3b. Oder Cover von SoundCloud-Link laden</label>
        <div class="sc-row">
          <input type="text" id="sc-url-input" placeholder="https://soundcloud.com...">
          <button type="button" class="btn-sc" onclick="fetchSoundCloud()">Laden</button>
        </div>
        <img id="cover-preview" alt="Cover">
      </div>
      <div class="form-group" style="display:flex; gap:10px;">
        <div style="flex:1;"><label>BPM</label><input type="number" id="bpm-input" placeholder="128"></div>
        <div style="flex:2;"><label>DJ-Notiz</label><input type="text" id="note-input" placeholder="Cue / Übergang"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeAddModal()">Abbrechen</button>
        <button type="button" class="btn-save" onclick="saveNewTrack()">Speichern</button>
      </div>
    </div>
  </div>
  <div class="dj-player">
    <div class="player-top">
      <div class="player-cover-box">
        <div class="vinyl-fallback" id="player-vinyl-icon"></div>
        <img id="player-cover" alt="Cover">
      </div>
      <div class="player-info">
        <div class="player-title" id="player-title">Wähle eine Platte aus...</div>
        <div class="player-sub" id="player-sub">Bereit zum Auflegen</div>
      </div>
      <button type="button" class="btn-play" id="btn-play" onclick="togglePlayPause()">▶</button>
    </div>
    <div class="progress-container">
      <span id="time-current">0s</span>
      <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1" oninput="seekAudio(this.value)">
      <span id="time-total">0s</span>
    </div>
  </div>
  <audio id="audio-player"></audio>
  <script>
    var db = null, currentCoverData = "", trackList = [], activeTrackId = null;
    var audio = document.getElementById('audio-player'), seekBar = document.getElementById('seek-bar');

    function setStatus(t) { document.getElementById('modal-status').innerText = t; }

    function showToast(msg) {
      var toast = document.getElementById('toast-msg');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(function() { toast.classList.remove('show'); }, 3000);
    }

    try {
      var req = indexedDB.open("VinylCrateDB_v4", 1);
      req.onupgradeneeded = function(e) {
        db = e.target.result;
        if (!db.objectStoreNames.contains("tracks")) db.createObjectStore("tracks", { keyPath: "id" });
      };
      req.onsuccess = function(e) { db = e.target.result; loadAllTracks(); };
      req.onerror = function() { db = null; };
    } catch (err) {
      db = null;
    }

    function openAddModal() {
      currentCoverData = "";
      setStatus("");
      ['mp3-input','title-input','img-input','sc-url-input','bpm-input','note-input'].forEach(function(id){
        document.getElementById(id).value = "";
      });
      document.getElementById('cover-preview').style.display = "none";
      document.getElementById('add-modal').classList.add('open');
    }

    function closeAddModal() { document.getElementById('add-modal').classList.remove('open'); }

    function handleMp3Select(input) {
      if (input.files && input.files.item(0)) {
        var f = input.files.item(0);
        if (!document.getElementById('title-input').value) {
          document.getElementById('title-input').value = f.name.replace(/\.[^/.]+$/, "");
        }
        setStatus("MP3 bereit: " + f.name);
      }
    }

    function handleImgSelect(input) {
      if (input.files && input.files.item(0)) {
        var r = new FileReader();
        r.onload = function(e) {
          currentCoverData = e.target.result;
          var p = document.getElementById('cover-preview');
          p.src = currentCoverData;
          p.style.display = "block";
          setStatus("Eigenes Cover geladen!");
        };
        r.readAsDataURL(input.files.item(0));
      }
    }

    async function fetchSoundCloud() {
      var url = document.getElementById('sc-url-input').value.trim();
      if (!url) return setStatus("Bitte SoundCloud-Link einfügen.");
      setStatus("Lade SoundCloud-Cover...");
      try {
        var res = await fetch("https://soundcloud.com" + encodeURIComponent(url));
        var data = await res.json();
        if (data.thumbnail_url) {
          currentCoverData = data.thumbnail_url.replace("-large", "-t500x500");
          var p = document.getElementById('cover-preview');
          p.src = currentCoverData;
          p.style.display = "block";
          setStatus("SoundCloud-Cover geladen!");
          if (!document.getElementById('title-input').value && data.title) {
            document.getElementById('title-input').value = data.title;
          }
        } else {
          setStatus("Kein Cover gefunden.");
        }
      } catch (e) {
        setStatus("Cover konnte nicht geladen werden.");
      }
    }

    function saveNewTrack() {
      var mp3 = document.getElementById('mp3-input');
      if (!mp3.files || !mp3.files.item(0)) return setStatus("Bitte zuerst eine MP3-Datei wählen!");
      var f = mp3.files.item(0);

      var item = {
        id: Date.now(),
        title: document.getElementById('title-input').value.trim() || f.name,
        bpm: document.getElementById('bpm-input').value.trim(),
        note: document.getElementById('note-input').value.trim(),
        cover: currentCoverData,
        audioFile: f
      };

      if (db) {
        try {
          var tx = db.transaction("tracks", "readwrite");
          tx.objectStore("tracks").add(item);
          tx.oncomplete = function() { closeAddModal(); loadAllTracks(); };
          tx.onerror = function() { fallbackSave(item); };
        } catch (e) {
          fallbackSave(item);
        }
      } else {
        fallbackSave(item);
      }
    }

    function fallbackSave(item) {
      trackList.push(item);
      closeAddModal();
      renderTracks();
    }

    function loadAllTracks() {
      if (!db) return;
      var req = db.transaction("tracks", "readonly").objectStore("tracks").getAll();
      req.onsuccess = function() { trackList = req.result || []; renderTracks(); };
    }

    function renderTracks() {
      var grid = document.getElementById('crate-grid');
      document.getElementById('crate-count').innerText = "Deine Plattenkiste (" + trackList.length + " Tracks)";
      grid.innerHTML = "";
      trackList.forEach(function(track) {
        var card = document.createElement('div');
        card.className = "vinyl-card" + (track.id === activeTrackId ? " active" : "");
        card.onclick = function() { playTrack(track); };
        card.innerHTML = '<div class="cover-wrapper">' +
          (track.cover ? '<img src="' + track.cover + '">' : '<div class="vinyl-fallback"></div>') +
          (track.bpm ? '<div class="bpm-badge">' + track.bpm + ' BPM</div>' : '') +
          '<button type="button" class="card-btn btn-share" title="MP3 Teilen">📤</button>' +
          '<button type="button" class="card-btn btn-download" title="MP3 Speichern">💾</button>' +
          '<button type="button" class="card-btn btn-delete" title="Löschen">×</button></div>' +
          '<div class="track-meta"><div class="track-title">' + track.title + '</div>' +
          '<div class="track-note">' + (track.note || "Keine Notiz") + '</div></div>';
        
        card.querySelector('.btn-share').onclick = function(e) { 
          e.stopPropagation(); 
          shareTrackFile(track); 
        };
        card.querySelector('.btn-download').onclick = function(e) { 
          e.stopPropagation(); 
          downloadTrackFile(track); 
        };
        card.querySelector('.btn-delete').onclick = function(e) { 
          e.stopPropagation(); 
          removeTrack(track.id); 
        };
        grid.appendChild(card);
      });
    }

    async function shareTrackFile(track) {
      var safeName = (track.title || "track").replace(/[^a-zA-Z0-9äöüÄÖÜß _-]/g, "") + ".mp3";
      var infoText = "🎵 " + track.title + (track.bpm ? " (" + track.bpm + " BPM)" : "");

      try {
        var mp3Blob = new Blob([track.audioFile], { type: "audio/mpeg" });
        var fileToShare = new File([mp3Blob], safeName, { type: "audio/mpeg" });

        if (navigator.canShare && navigator.canShare({ files: [fileToShare] })) {
          await navigator.share({
            files: [fileToShare],
            title: track.title,
            text: infoText
          });
          return;
        }
      } catch (err) {
        if (err.name === "AbortError") return;
      }

      // Falls Browser/Spck-Vorschau das direkte MP3-Teilen blockiert:
      showToast("Direkt-Teilen hier gesperrt – nutze 💾 zum Exportieren!");
    }

    function downloadTrackFile(track) {
      var safeName = (track.title || "track").replace(/[^a-zA-Z0-9äöüÄÖÜß _-]/g, "") + ".mp3";
      var url = URL.createObjectURL(track.audioFile);
      var a = document.createElement('a');
      a.href = url;
      a.download = safeName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
      showToast("MP3 gespeichert: " + safeName);
    }

    function removeTrack(id) {
      if (db) {
        var tx = db.transaction("tracks", "readwrite");
        tx.objectStore("tracks").delete(id);
        tx.oncomplete = loadAllTracks;
      } else {
        trackList = trackList.filter(function(t) { return t.id !== id; });
        renderTracks();
      }
    }

    function playTrack(track) {
      activeTrackId = track.id;
      audio.src = URL.createObjectURL(track.audioFile);
      audio.play().catch(function(e) { alert("Audio-Wiedergabe blockiert: " + e.message); });
      document.getElementById('player-title').innerText = track.title;
      document.getElementById('player-sub').innerText = (track.bpm ? track.bpm + " BPM • " : "") + (track.note || "Läuft");
      document.getElementById('btn-play').innerText = "⏸";
      var pImg = document.getElementById('player-cover'), pIcon = document.getElementById('player-vinyl-icon');
      if (track.cover) {
        pImg.src = track.cover; pImg.style.display = "block"; pIcon.style.display = "none";
      } else {
        pImg.style.display = "none"; pIcon.style.display = "block";
      }
      renderTracks();
    }

    function togglePlayPause() {
      if (!audio.src) return;
      if (audio.paused) { audio.play(); document.getElementById('btn-play').innerText = "⏸"; }
      else { audio.pause(); document.getElementById('btn-play').innerText = "▶"; }
    }

    function seekAudio(v) { if (audio.duration) audio.currentTime = (v / 100) * audio.duration; }

    audio.onloadedmetadata = function() {
      document.getElementById('time-current').innerText = "0s";
      document.getElementById('time-total').innerText = fmt(audio.duration);
    };

    audio.ontimeupdate = function() {
      if (!audio.duration) return;
      seekBar.value = (audio.currentTime / audio.duration) * 100;
      document.getElementById('time-current').innerText = fmt(audio.currentTime);
      document.getElementById('time-total').innerText = fmt(audio.duration);
    };

    audio.onended = function() {
      var idx = trackList.findIndex(function(t) { return t.id === activeTrackId; });
      if (idx !== -1 && idx + 1 < trackList.length) playTrack(trackList[idx + 1]);
      else document.getElementById('btn-play').innerText = "▶";
    };

    function fmt(s) {
      if (!s || isNaN(s)) return "0s";
      return Math.floor(s) + "s";
    }
  </script>
</body>
</html>
